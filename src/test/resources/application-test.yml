spring:
  datasource:
    url: jdbc:h2:mem:moving-reservation-test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: false
  mail:
    host:

notification:
  email:
    enabled: false
    from:
  sms:
    enabled: false
    provider: disabled
    from:
    admin-to:

privacy:
  retention:
    conflict-attempt-days: 30
    cleanup-cron: "0 0 3 * * *"

reservation:
  schedule-conflict:
    enabled: false

upload:
  reservation-photo:
    directory: target/test-uploads/reservation-photos

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:3000
