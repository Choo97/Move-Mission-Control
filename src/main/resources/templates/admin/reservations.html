<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
        <a th:href="@{/admin/account/users/new}">계정 추가</a>
        <a th:href="@{/admin/account/password}">비밀번호 변경</a>
        <form class="nav-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Operations Board</p>
        <h1>예약 관제 보드</h1>
        <p>접수된 이사 미션의 상태와 견적을 관리합니다.</p>
    </section>

    <section class="stats">
        <div><span th:text="${summary.total()}">0</span><p>전체</p></div>
        <div><span th:text="${summary.received()}">0</span><p>접수</p></div>
        <div><span th:text="${summary.consulting()}">0</span><p>상담중</p></div>
        <div><span th:text="${summary.confirmed()}">0</span><p>확정</p></div>
    </section>

    <form class="filter-panel filter-panel--wide" th:action="@{/admin/reservations}" method="get">
        <label>
            상태
            <select name="status">
                <option value="">전체 상태</option>
                <option th:each="status : ${statuses}"
                        th:value="${status}"
                        th:text="${status.label}"
                        th:selected="${status == selectedStatus}"></option>
            </select>
        </label>
        <label>
            고객명 / 연락처
            <input type="text" name="keyword" th:value="${keyword}" placeholder="고객명 또는 연락처">
        </label>
        <label>
            시작일
            <input type="date" name="startDate" th:value="${startDate}">
        </label>
        <label>
            종료일
            <input type="date" name="endDate" th:value="${endDate}">
        </label>
        <div class="filter-actions">
            <button type="submit">검색</button>
            <a class="button button--ghost" th:href="@{/admin/reservations}">초기화</a>
        </div>
        <div class="quick-filters">
            <a th:href="@{/admin/reservations(status=${selectedStatus}, keyword=${keyword}, startDate=${today}, endDate=${today})}">오늘</a>
            <a th:href="@{/admin/reservations(status=${selectedStatus}, keyword=${keyword}, startDate=${weekStart}, endDate=${weekEnd})}">이번 주</a>
            <a th:href="@{/admin/reservations(status=${selectedStatus}, keyword=${keyword}, startDate=${monthStart}, endDate=${monthEnd})}">이번 달</a>
        </div>
    </form>

    <section class="table-shell">
        <table>
            <thead>
            <tr>
                <th>번호</th>
                <th>고객</th>
                <th>일정</th>
                <th>유형</th>
                <th>경로</th>
                <th>상태</th>
                <th>견적</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${reservations.isEmpty()}">
                <td colspan="7" class="empty">조건에 맞는 예약이 없습니다.</td>
            </tr>
            <tr th:each="reservation : ${reservations}">
                <td>
                    <a class="text-link"
                       th:href="@{/admin/reservations/{id}(id=${reservation.id})}"
                       th:text="${reservation.id}">1</a>
                </td>
                <td>
                    <a class="text-link"
                       th:href="@{/admin/reservations/{id}(id=${reservation.id})}"
                       th:text="${reservation.customerName}">홍길동</a>
                    <span th:text="${reservation.phone}">010-0000-0000</span>
                </td>
                <td th:text="${reservation.moveDate + ' ' + reservation.moveTime}">2026-06-01 09:00</td>
                <td th:text="${reservation.moveType.label}">원룸</td>
                <td th:text="${reservation.fromAddress + ' -> ' + reservation.toAddress}">출발 -> 도착</td>
                <td>
                    <form th:action="@{/admin/reservations/{id}/status(id=${reservation.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <select name="status">
                            <option th:each="status : ${statuses}"
                                    th:value="${status}"
                                    th:text="${status.label}"
                                    th:selected="${status == reservation.status}"></option>
                        </select>
                        <button type="submit">변경</button>
                    </form>
                </td>
                <td>
                    <form th:action="@{/admin/reservations/{id}/estimate(id=${reservation.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <input type="number" name="estimatedPrice" min="0" step="10000" th:value="${reservation.estimatedPrice}">
                        <button type="submit">저장</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
