<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠폰 사용이력 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
        <a th:href="@{/admin/notifications}">알림 이력</a>
        <a th:href="@{/admin/audit-logs}">감사 로그</a>
        <a th:href="@{/admin/coupons}">쿠폰 관리</a>
        <a th:href="@{/admin/coupons/usages}">쿠폰 이력</a>
        <a th:href="@{/admin/reviews}">리뷰 관리</a>
        <a th:href="@{/admin/faqs}">FAQ 관리</a>
        <a th:href="@{/admin/account/users}">계정 목록</a>
        <a th:href="@{/admin/account/users/new}">계정 추가</a>
        <a th:href="@{/admin/account/password}">비밀번호 변경</a>
        <form class="nav-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Coupon Usage</p>
        <h1>쿠폰 사용이력</h1>
        <p>예약에 적용된 쿠폰과 할인 결과를 확인합니다.</p>
    </section>

    <div class="actions">
        <a class="button button--ghost" th:href="@{/admin/coupons}">쿠폰 관리</a>
        <a class="button button--primary" th:href="@{/admin/reservations}">예약 목록</a>
    </div>

    <section class="table-shell">
        <table>
            <thead>
            <tr>
                <th>예약</th>
                <th>고객</th>
                <th>쿠폰</th>
                <th>할인 정책</th>
                <th>견적</th>
                <th>할인</th>
                <th>최종 견적</th>
                <th>사용일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${couponUsages.isEmpty()}">
                <td colspan="8" class="empty">아직 쿠폰 사용이력이 없습니다.</td>
            </tr>
            <tr th:each="usage : ${couponUsages}">
                <td>
                    <a class="text-link"
                       th:href="@{/admin/reservations/{id}(id=${usage.id})}"
                       th:text="${usage.id}">1</a>
                </td>
                <td>
                    <a class="text-link"
                       th:href="@{/admin/reservations/{id}(id=${usage.id})}"
                       th:text="${usage.customerName}">홍길동</a>
                    <span th:text="${usage.phone}">010-0000-0000</span>
                </td>
                <td>
                    <strong th:text="${usage.couponCode}">MOVE10</strong>
                    <span th:text="${usage.couponName}">첫 예약 할인</span>
                </td>
                <td th:text="${usage.couponDiscountType.name() == 'PERCENT' ? usage.couponDiscountValue + '%' : #numbers.formatInteger(usage.couponDiscountValue, 0, 'COMMA') + '원'}">10%</td>
                <td th:text="${usage.estimatedPrice == null ? '상담 후 안내' : #numbers.formatInteger(usage.estimatedPrice, 0, 'COMMA') + '원'}">상담 후 안내</td>
                <td th:text="${usage.estimatedPrice == null ? '견적 입력 후 계산' : #numbers.formatInteger(usage.appliedDiscountAmount, 0, 'COMMA') + '원'}">견적 입력 후 계산</td>
                <td th:text="${usage.finalEstimatedPrice == null ? '상담 후 안내' : #numbers.formatInteger(usage.finalEstimatedPrice, 0, 'COMMA') + '원'}">상담 후 안내</td>
                <td th:text="${#temporals.format(usage.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-02 10:00</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
