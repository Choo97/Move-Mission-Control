<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>쿠폰 관리 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
        <a th:href="@{/admin/coupons}">쿠폰 관리</a>
        <a th:href="@{/admin/coupons/usages}">쿠폰 이력</a>
        <a th:href="@{/admin/reviews}">리뷰 관리</a>
        <a th:href="@{/admin/account/users}">계정 목록</a>
        <a th:href="@{/admin/account/users/new}">계정 추가</a>
        <a th:href="@{/admin/account/password}">비밀번호 변경</a>
        <form class="nav-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Coupon Policy</p>
        <h1>쿠폰 및 할인 정책</h1>
        <p>예약 신청 시 사용할 쿠폰을 만들고 사용 가능 여부를 관리합니다.</p>
    </section>

    <p class="notice" th:if="${couponMessage}" th:text="${couponMessage}">쿠폰이 저장되었습니다.</p>
    <p class="alert" th:if="${couponError}" th:text="${couponError}">쿠폰을 저장할 수 없습니다.</p>

    <form class="form-shell" th:action="@{/admin/coupons}" th:object="${couponCreateRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <div class="field-grid">
            <label>
                쿠폰 코드
                <input type="text" th:field="*{code}" placeholder="예: MOVE10">
                <small th:if="${#fields.hasErrors('code')}" th:errors="*{code}"></small>
            </label>
            <label>
                쿠폰 이름
                <input type="text" th:field="*{name}" placeholder="예: 첫 예약 10% 할인">
                <small th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></small>
            </label>
            <label>
                할인 방식
                <select th:field="*{discountType}">
                    <option value="">선택</option>
                    <option th:each="discountType : ${discountTypes}"
                            th:value="${discountType}"
                            th:text="${discountType.label}"></option>
                </select>
                <small th:if="${#fields.hasErrors('discountType')}" th:errors="*{discountType}"></small>
            </label>
            <label>
                할인 값
                <input type="number" th:field="*{discountValue}" min="1" step="1" placeholder="정률 10 또는 정액 30000">
                <small th:if="${#fields.hasErrors('discountValue')}" th:errors="*{discountValue}"></small>
            </label>
        </div>

        <div class="form-actions">
            <a class="button button--ghost" th:href="@{/admin/reservations}">예약 목록</a>
            <a class="button button--ghost" th:href="@{/admin/coupons/usages}">쿠폰 사용이력</a>
            <button class="button button--primary" type="submit">쿠폰 추가</button>
        </div>
    </form>

    <section class="section-title">
        <p class="eyebrow">Coupon List</p>
        <h2>등록된 쿠폰</h2>
    </section>

    <section class="table-shell">
        <table>
            <thead>
            <tr>
                <th>코드</th>
                <th>이름</th>
                <th>할인</th>
                <th>상태</th>
                <th>작업</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${coupons.isEmpty()}">
                <td colspan="5" class="empty">등록된 쿠폰이 없습니다.</td>
            </tr>
            <tr th:each="coupon : ${coupons}">
                <td th:text="${coupon.code}">MOVE10</td>
                <td th:text="${coupon.name}">첫 예약 할인</td>
                <td th:text="${coupon.discountType.name() == 'PERCENT' ? coupon.discountValue + '%' : #numbers.formatInteger(coupon.discountValue, 0, 'COMMA') + '원'}">10%</td>
                <td th:text="${coupon.active ? '사용 가능' : '사용 중지'}">사용 가능</td>
                <td>
                    <form th:if="${coupon.active}" th:action="@{/admin/coupons/{id}/deactivate(id=${coupon.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">중지</button>
                    </form>
                    <form th:unless="${coupon.active}" th:action="@{/admin/coupons/{id}/activate(id=${coupon.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">사용</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
</body>
</html>
