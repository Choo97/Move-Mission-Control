<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>감사 로그 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav th:replace="~{fragments/admin-nav :: adminNav}"></nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Admin Audit</p>
        <h1>관리자 감사 로그</h1>
        <p>관리자가 처리한 작업과 개인정보 조회 이력을 작업자, 시간, 접근 정보 기준으로 확인합니다.</p>
    </section>

    <form class="filter-panel filter-panel--audit" th:action="@{/admin/audit-logs}" method="get">
        <label>
            작업 종류
            <select name="action">
                <option value="">전체 작업</option>
                <option th:each="action : ${actions}"
                        th:value="${action}"
                        th:text="${action}"
                        th:selected="${action == selectedAction}"></option>
            </select>
        </label>
        <label>
            작업자
            <input type="text" name="createdBy" th:value="${createdBy}" placeholder="예: admin">
        </label>
        <label>
            키워드
            <input type="text" name="keyword" th:value="${keyword}" placeholder="작업 내용, 고객명, 연락처">
        </label>
        <label>
            시작일
            <input type="date" name="startDate" th:value="${startDate}">
        </label>
        <label>
            종료일
            <input type="date" name="endDate" th:value="${endDate}">
        </label>
        <div class="filter-actions">
            <button type="submit">검색</button>
            <a class="button button--ghost" th:href="@{/admin/audit-logs}">초기화</a>
        </div>
    </form>

    <section class="table-shell">
        <table>
            <thead>
            <tr>
                <th>일시</th>
                <th>작업자</th>
                <th>작업</th>
                <th>예약</th>
                <th>고객</th>
                <th>접근 정보</th>
                <th>상세 내용</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${auditLogs.isEmpty()}">
                <td colspan="7" class="empty">조건에 맞는 감사 로그가 없습니다.</td>
            </tr>
            <tr th:each="auditLog : ${auditLogs}">
                <td th:text="${#temporals.format(auditLog.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-05 10:00</td>
                <td th:text="${auditLog.createdBy}">admin</td>
                <td>
                    <strong th:text="${auditLog.action}">견적 금액 저장</strong>
                </td>
                <td>
                    <a class="text-link"
                       th:if="${auditLog.reservation != null}"
                       th:href="@{/admin/reservations/{id}(id=${auditLog.reservation.id})}"
                       th:text="${auditLog.reservation.id}">1</a>
                    <span th:unless="${auditLog.reservation != null}">-</span>
                </td>
                <td>
                    <a class="text-link"
                       th:if="${auditLog.reservation != null}"
                       th:href="@{/admin/reservations/{id}(id=${auditLog.reservation.id})}"
                       th:text="${auditLog.reservation.customerName}">홍길동</a>
                    <span th:if="${auditLog.reservation != null}" th:text="${auditLog.reservation.phone}">010-0000-0000</span>
                    <span th:unless="${auditLog.reservation != null}">예약 없음</span>
                </td>
                <td>
                    <span th:text="${#strings.isEmpty(auditLog.ipAddress) ? 'IP unknown' : 'IP ' + auditLog.ipAddress}">IP 127.0.0.1</span>
                    <span th:text="${#strings.isEmpty(auditLog.userAgent) ? 'User-Agent unknown' : auditLog.userAgent}">Mozilla</span>
                </td>
                <td th:text="${auditLog.detail}">작업 상세 내용</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
