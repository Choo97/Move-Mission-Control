<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>리뷰 관리 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav th:replace="~{fragments/admin-nav :: adminNav}"></nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Customer Voice</p>
        <h1>리뷰 관리</h1>
        <p>고객이 남긴 평점과 리뷰를 확인합니다.</p>
    </section>

    <section class="table-shell">
        <table>
            <thead>
            <tr>
                <th>예약</th>
                <th>고객</th>
                <th>평점</th>
                <th>리뷰</th>
                <th>작성일</th>
            </tr>
            </thead>
            <tbody>
            <tr th:if="${reviews.isEmpty()}">
                <td colspan="5" class="empty">아직 등록된 리뷰가 없습니다.</td>
            </tr>
            <tr th:each="review : ${reviews}">
                <td>
                    <a class="text-link"
                       th:href="@{/admin/reservations/{id}(id=${review.reservation.id})}"
                       th:text="${review.reservation.id}">1</a>
                </td>
                <td>
                    <a class="text-link"
                       th:href="@{/admin/reservations/{id}(id=${review.reservation.id})}"
                       th:text="${T(com.moving.reservation.privacy.PersonalInfoMasker).maskName(review.reservation.customerName)}">홍길동</a>
                    <span th:text="${T(com.moving.reservation.privacy.PersonalInfoMasker).maskPhone(review.reservation.phone)}">010-0000-0000</span>
                </td>
                <td th:text="${review.rating + '점'}">5점</td>
                <td th:text="${review.content}">친절했습니다.</td>
                <td th:text="${#temporals.format(review.createdAt, 'yyyy-MM-dd HH:mm')}">2026-06-02 10:00</td>
            </tr>
            </tbody>
        </table>
    </section>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
