<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>자주 묻는 질문 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/faq}">FAQ</a>
        <a th:href="@{/admin/reservations}">관리자</a>
    </nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Customer Help</p>
        <h1>자주 묻는 질문</h1>
        <p>이사 예약 전후에 고객이 자주 확인하는 내용을 정리했습니다.</p>
    </section>

    <section class="faq-list">
        <article th:if="${faqs.isEmpty()}">
            <h2>등록된 질문이 없습니다.</h2>
            <p>관리자 화면에서 고객 FAQ를 등록해 주세요.</p>
        </article>
        <article th:each="faq : ${faqs}">
            <h2 th:text="${faq.question}">예약 후에는 어떻게 확인하나요?</h2>
            <p th:text="${faq.answer}">예약 번호와 연락처로 예약조회 화면에서 확인할 수 있습니다.</p>
        </article>
    </section>

    <div class="actions">
        <a class="button button--primary" th:href="@{/reservations/new}">예약 시작하기</a>
        <a class="button button--ghost" th:href="@{/reservations/search}">내 예약 조회</a>
    </div>
</main>
</body>
</html>
