<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예약 수정 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <script src="//t1.kakaocdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
    <script defer th:src="@{/js/address-search.js}"></script>
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
    </nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Mission Update</p>
        <h1>예약 수정</h1>
        <p>예약 번호 <strong th:text="${reservation.id}">1</strong>번의 일정과 주소 정보를 수정합니다.</p>
    </section>

    <form class="form-shell" th:action="@{/reservations/{id}/edit(id=${reservation.id})}"
          th:object="${reservationUpdateRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p class="alert" th:if="${updateError}" th:text="${updateError}">예약을 수정할 수 없습니다.</p>
        <p class="empty" th:unless="${reservation.editable}">현재 상태에서는 고객 수정이 불가능합니다.</p>

        <label>
            예약 당시 연락처
            <input type="text" th:field="*{phone}" placeholder="010-1234-5678">
            <small th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
        </label>

        <label>
            이메일
            <input type="email" th:field="*{email}" placeholder="customer@example.com" th:disabled="${!reservation.editable}">
            <span class="help-text">이메일을 입력하면 이후 예약 확인 안내에 사용할 수 있습니다.</span>
            <small th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></small>
        </label>

        <div class="field-grid">
            <label>
                이사 날짜
                <input type="date" th:field="*{moveDate}" th:disabled="${!reservation.editable}">
                <small th:if="${#fields.hasErrors('moveDate')}" th:errors="*{moveDate}"></small>
            </label>
            <label>
                희망 시간
                <input type="time" th:field="*{moveTime}" th:disabled="${!reservation.editable}">
                <small th:if="${#fields.hasErrors('moveTime')}" th:errors="*{moveTime}"></small>
            </label>
            <label>
                출발 주소
                <div class="address-control">
                    <input type="text" th:field="*{fromAddress}" th:disabled="${!reservation.editable}">
                    <button class="button button--ghost" type="button" data-address-target="fromAddress" th:disabled="${!reservation.editable}">주소 검색</button>
                </div>
                <span class="help-text">주소를 선택한 뒤 동, 호수, 층수 등 상세주소를 이어서 입력해 주세요.</span>
                <small th:if="${#fields.hasErrors('fromAddress')}" th:errors="*{fromAddress}"></small>
            </label>
            <label>
                도착 주소
                <div class="address-control">
                    <input type="text" th:field="*{toAddress}" th:disabled="${!reservation.editable}">
                    <button class="button button--ghost" type="button" data-address-target="toAddress" th:disabled="${!reservation.editable}">주소 검색</button>
                </div>
                <span class="help-text">주소를 선택한 뒤 동, 호수, 층수 등 상세주소를 이어서 입력해 주세요.</span>
                <small th:if="${#fields.hasErrors('toAddress')}" th:errors="*{toAddress}"></small>
            </label>
            <label>
                출발지 층수
                <input type="number" th:field="*{fromFloor}" min="1" max="50" th:disabled="${!reservation.editable}">
                <small th:if="${#fields.hasErrors('fromFloor')}" th:errors="*{fromFloor}"></small>
            </label>
            <label>
                도착지 층수
                <input type="number" th:field="*{toFloor}" min="1" max="50" th:disabled="${!reservation.editable}">
                <small th:if="${#fields.hasErrors('toFloor')}" th:errors="*{toFloor}"></small>
            </label>
            <div class="checks">
                <label><input type="checkbox" th:field="*{fromLadderTruck}" th:disabled="${!reservation.editable}"> 출발지 사다리차 필요</label>
                <label><input type="checkbox" th:field="*{toLadderTruck}" th:disabled="${!reservation.editable}"> 도착지 사다리차 필요</label>
            </div>
        </div>

        <label>
            요청사항
            <textarea th:field="*{memo}" rows="5" th:disabled="${!reservation.editable}"></textarea>
        </label>

        <div class="form-actions">
            <a class="button button--ghost" th:href="@{/reservations/{id}(id=${reservation.id})}">상세로</a>
            <button class="button button--primary" type="submit" th:disabled="${!reservation.editable}">수정 저장</button>
        </div>
    </form>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
