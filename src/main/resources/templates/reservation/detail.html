<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>예약 상세 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
    </nav>
</header>

<main class="page narrow">
    <section class="page-heading">
        <p class="eyebrow">Mission Received</p>
        <h1>예약이 접수되었습니다</h1>
        <p>예약 번호 <strong th:text="${reservation.id}">1</strong>번으로 등록되었습니다.</p>
    </section>

    <section class="detail-panel">
        <div>
            <span>상태</span>
            <strong th:text="${reservation.status.label}">접수</strong>
        </div>
        <div>
            <span>고객명</span>
            <strong th:text="${reservation.customerName}">홍길동</strong>
        </div>
        <div>
            <span>일정</span>
            <strong th:text="${reservation.moveDate + ' ' + reservation.moveTime}">2026-06-01 09:00</strong>
        </div>
        <div>
            <span>경로</span>
            <strong th:text="${reservation.fromAddress + ' -> ' + reservation.toAddress}">출발 -> 도착</strong>
        </div>
        <div>
            <span>견적</span>
            <strong th:text="${reservation.estimatedPrice == null ? '상담 후 안내' : #numbers.formatInteger(reservation.estimatedPrice, 0, 'COMMA') + '원'}">상담 후 안내</strong>
        </div>
    </section>

    <p class="notice" th:if="${updateMessage}" th:text="${updateMessage}">예약 정보가 수정되었습니다.</p>

    <section class="cancel-panel">
        <div class="section-title">
            <p class="eyebrow">Cancel Request</p>
            <h2>예약 취소</h2>
        </div>

        <p class="notice" th:if="${cancelMessage}" th:text="${cancelMessage}">예약이 취소되었습니다.</p>
        <p class="alert" th:if="${cancelError}" th:text="${cancelError}">예약을 취소할 수 없습니다.</p>
        <p class="empty" th:unless="${reservation.cancelable}">현재 상태에서는 고객 취소가 불가능합니다.</p>

        <form th:if="${reservation.cancelable}" th:action="@{/reservations/{id}/cancel(id=${reservation.id})}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <label>
                예약 당시 연락처
                <input type="text" name="phone" placeholder="010-1234-5678" required>
            </label>
            <button class="button button--danger" type="submit">예약 취소</button>
        </form>
    </section>

    <div class="actions">
        <a class="button button--primary" th:href="@{/}">홈으로</a>
        <a class="button button--ghost" th:if="${reservation.editable}" th:href="@{/reservations/{id}/edit(id=${reservation.id})}">예약 수정</a>
        <a class="button button--ghost" th:href="@{/admin/reservations}">관리자 화면</a>
    </div>
</main>
</body>
</html>
