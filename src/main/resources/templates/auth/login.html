<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 로그인 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
    </nav>
</header>

<main class="page narrow">
    <section class="page-heading">
        <p class="eyebrow">Admin Access</p>
        <h1>관리자 로그인</h1>
        <p>예약 현황과 고객 정보를 확인하려면 관리자 계정으로 로그인해야 합니다.</p>
    </section>

    <form class="form-shell" th:action="@{/login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p class="alert" th:if="${param.error}">아이디 또는 비밀번호가 올바르지 않습니다.</p>
        <p class="notice" th:if="${param.logout}">로그아웃되었습니다.</p>
        <p class="notice" th:if="${param.passwordChanged}">비밀번호가 변경되었습니다. 새 비밀번호로 다시 로그인해 주세요.</p>

        <label>
            아이디
            <input type="text" name="username" placeholder="admin" autocomplete="username">
        </label>

        <label>
            비밀번호
            <input type="password" name="password" placeholder="admin1234" autocomplete="current-password">
        </label>

        <div class="form-actions">
            <a class="button button--ghost" th:href="@{/}">홈으로</a>
            <button class="button button--primary" type="submit">로그인</button>
        </div>
    </form>
</main>
</body>
</html>
