<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>비밀번호 변경 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
        <a th:href="@{/admin/account/password}">비밀번호 변경</a>
        <form class="nav-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main class="page narrow">
    <section class="page-heading">
        <p class="eyebrow">Account Security</p>
        <h1>관리자 비밀번호 변경</h1>
        <p>현재 비밀번호를 확인한 뒤 새 비밀번호를 저장합니다.</p>
    </section>

    <form class="form-shell" th:action="@{/admin/account/password}" th:object="${adminPasswordChangeRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p class="alert" th:if="${changeError}" th:text="${changeError}">비밀번호를 변경할 수 없습니다.</p>

        <label>
            현재 비밀번호
            <input type="password" th:field="*{currentPassword}" autocomplete="current-password">
            <small th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></small>
        </label>

        <label>
            새 비밀번호
            <input type="password" th:field="*{newPassword}" autocomplete="new-password">
            <small th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></small>
        </label>

        <label>
            새 비밀번호 확인
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
            <small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
        </label>

        <div class="form-actions">
            <a class="button button--ghost" th:href="@{/admin/reservations}">관리자 화면</a>
            <button class="button button--primary" type="submit">비밀번호 저장</button>
        </div>
    </form>
</main>
</body>
</html>
