<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 계정 추가 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav th:replace="~{fragments/admin-nav :: adminNav}"></nav>
</header>

<main class="page narrow">
    <section class="page-heading">
        <p class="eyebrow">Admin Account</p>
        <h1>관리자 계정 추가</h1>
        <p>새 운영 담당자가 사용할 관리자 계정을 생성합니다.</p>
    </section>

    <form class="form-shell" th:action="@{/admin/account/users}" th:object="${adminUserCreateRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

        <p class="notice" th:if="${createMessage}" th:text="${createMessage}">관리자 계정이 생성되었습니다.</p>
        <p class="alert" th:if="${createError}" th:text="${createError}">관리자 계정을 생성할 수 없습니다.</p>

        <label>
            아이디
            <input type="text" th:field="*{username}" autocomplete="username" placeholder="예: manager01">
            <small th:if="${#fields.hasErrors('username')}" th:errors="*{username}"></small>
        </label>

        <label>
            초기 비밀번호
            <input type="password" th:field="*{password}" autocomplete="new-password">
            <small th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></small>
        </label>

        <label>
            초기 비밀번호 확인
            <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
            <small th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></small>
        </label>

        <div class="form-actions">
            <a class="button button--ghost" th:href="@{/admin/reservations}">관리자 화면</a>
            <a class="button button--ghost" th:href="@{/admin/account/users}">계정 목록</a>
            <button class="button button--primary" type="submit">계정 생성</button>
        </div>
    </form>
</main>
<script th:src="@{/js/theme.js}"></script>
</body>
</html>
