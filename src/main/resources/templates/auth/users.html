<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>관리자 계정 목록 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
        <a th:href="@{/admin/account/users}">계정 목록</a>
        <a th:href="@{/admin/account/users/new}">계정 추가</a>
        <a th:href="@{/admin/account/password}">비밀번호 변경</a>
        <form class="nav-form" th:action="@{/logout}" method="post">
            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
            <button type="submit">로그아웃</button>
        </form>
    </nav>
</header>

<main class="page">
    <section class="page-heading">
        <p class="eyebrow">Admin Accounts</p>
        <h1>관리자 계정 목록</h1>
        <p>운영 담당자 계정의 활성 상태를 관리합니다.</p>
    </section>

    <p class="notice" th:if="${accountMessage}" th:text="${accountMessage}">관리자 계정이 활성화되었습니다.</p>
    <p class="alert" th:if="${accountError}" th:text="${accountError}">계정 상태를 변경할 수 없습니다.</p>

    <section class="table-shell">
        <table>
            <thead>
            <tr>
                <th>아이디</th>
                <th>권한</th>
                <th>상태</th>
                <th>작업</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="adminUser : ${adminUsers}">
                <td th:text="${adminUser.username}">admin</td>
                <td th:text="${adminUser.role}">ADMIN</td>
                <td th:text="${adminUser.enabled ? '활성' : '비활성'}">활성</td>
                <td>
                    <form th:if="${adminUser.enabled}" th:action="@{/admin/account/users/{id}/deactivate(id=${adminUser.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button class="button button--danger" type="submit">비활성화</button>
                    </form>
                    <form th:unless="${adminUser.enabled}" th:action="@{/admin/account/users/{id}/activate(id=${adminUser.id})}" method="post">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                        <button type="submit">활성화</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </section>

    <div class="actions">
        <a class="button button--ghost" th:href="@{/admin/reservations}">관리자 화면</a>
        <a class="button button--primary" th:href="@{/admin/account/users/new}">계정 추가</a>
    </div>
</main>
</body>
</html>
