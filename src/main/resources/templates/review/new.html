<!doctype html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>리뷰 작성 | Move Mission Control</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="site-header">
    <a class="brand" th:href="@{/}">Move Mission Control</a>
    <nav>
        <a th:href="@{/reservations/new}">예약하기</a>
        <a th:href="@{/reservations/search}">예약조회</a>
        <a th:href="@{/admin/reservations}">관리자</a>
    </nav>
</header>

<main class="page narrow">
    <section class="page-heading">
        <p class="eyebrow">Customer Review</p>
        <h1>리뷰 작성</h1>
        <p>예약 번호 <strong th:text="${reservation.id}">1</strong>번 이사 서비스에 대한 만족도를 남겨주세요.</p>
    </section>

    <section class="detail-panel">
        <div>
            <span>상태</span>
            <strong th:text="${reservation.status.label}">완료</strong>
        </div>
        <div>
            <span>일정</span>
            <strong th:text="${reservation.moveDate + ' ' + reservation.moveTime}">2026-06-01 09:00</strong>
        </div>
        <div>
            <span>경로</span>
            <strong th:text="${reservation.fromAddress + ' -> ' + reservation.toAddress}">출발 -> 도착</strong>
        </div>
    </section>

    <p class="alert" th:if="${reviewError}" th:text="${reviewError}">리뷰를 저장할 수 없습니다.</p>
    <p class="notice" th:if="${review != null}">이미 이 예약에 대한 리뷰가 등록되어 있습니다.</p>
    <p class="empty" th:if="${review == null && reservation.status.name() != 'COMPLETED'}">완료된 예약만 리뷰를 작성할 수 있습니다.</p>

    <form class="form-shell" th:if="${review == null && reservation.status.name() == 'COMPLETED'}" th:action="@{/reviews}" th:object="${reviewCreateRequest}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <input type="hidden" th:field="*{reservationId}">

        <label>
            예약 당시 연락처
            <input type="text" th:field="*{phone}" placeholder="010-1234-5678">
            <small th:if="${#fields.hasErrors('phone')}" th:errors="*{phone}"></small>
        </label>

        <label>
            평점
            <select th:field="*{rating}">
                <option value="">선택</option>
                <option value="5">5점 - 매우 만족</option>
                <option value="4">4점 - 만족</option>
                <option value="3">3점 - 보통</option>
                <option value="2">2점 - 아쉬움</option>
                <option value="1">1점 - 매우 아쉬움</option>
            </select>
            <small th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}"></small>
        </label>

        <label>
            리뷰 내용
            <textarea th:field="*{content}" rows="6" placeholder="상담, 시간 준수, 포장, 운반 과정에 대한 의견을 적어주세요."></textarea>
            <small th:if="${#fields.hasErrors('content')}" th:errors="*{content}"></small>
        </label>

        <div class="form-actions">
            <a class="button button--ghost" th:href="@{/reservations/{id}(id=${reservation.id})}">예약 상세</a>
            <button class="button button--primary" type="submit">리뷰 등록</button>
        </div>
    </form>
</main>
</body>
</html>
