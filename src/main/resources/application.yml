spring:
  application:
    name: moving-reservation
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 30MB
  datasource:
    url: jdbc:mysql://localhost:3306/movemission?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: mysql
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

map:
  kakao:
    enabled: ${KAKAO_MAP_ENABLED:false}
    rest-api-key: ${KAKAO_REST_API_KEY:}
