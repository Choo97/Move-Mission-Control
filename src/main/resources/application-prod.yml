spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: false
    open-in-view: false
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}

server:
  address: 0.0.0.0
  port: ${PORT:${SERVER_PORT:8080}}
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        secure: true
        same-site: none

notification:
  email:
    enabled: ${NOTIFICATION_EMAIL_ENABLED:false}
    from: ${NOTIFICATION_EMAIL_FROM:}
    subject-prefix: ${NOTIFICATION_EMAIL_SUBJECT_PREFIX:[Move Mission Control]}
  sms:
    enabled: ${NOTIFICATION_SMS_ENABLED:false}
    provider: ${SMS_PROVIDER:disabled}
    from: ${SMS_FROM:}
    admin-to: ${SMS_ADMIN_TO:}
    access-key: ${SMS_ACCESS_KEY:}
    secret-key: ${SMS_SECRET_KEY:}
    service-id: ${SMS_SERVICE_ID:}

privacy:
  crypto:
    secret: ${PRIVACY_CRYPTO_SECRET}
  hash:
    secret: ${PRIVACY_HASH_SECRET}
  retention:
    conflict-attempt-days: ${PRIVACY_CONFLICT_ATTEMPT_RETENTION_DAYS:30}
    cleanup-cron: "${PRIVACY_RETENTION_CLEANUP_CRON:0 0 3 * * *}"

reservation:
  lookup:
    max-failure-count: ${RESERVATION_LOOKUP_MAX_FAILURE_COUNT:5}
    failure-window-minutes: ${RESERVATION_LOOKUP_FAILURE_WINDOW_MINUTES:10}
    lock-minutes: ${RESERVATION_LOOKUP_LOCK_MINUTES:10}
    cleanup-delay-minutes: ${RESERVATION_LOOKUP_CLEANUP_DELAY_MINUTES:30}

upload:
  reservation-photo:
    directory: ${RESERVATION_PHOTO_UPLOAD_DIR:/app/uploads/reservation-photos}
    max-file-size-bytes: ${RESERVATION_PHOTO_MAX_FILE_SIZE_BYTES:10485760}
    max-files-per-request: ${RESERVATION_PHOTO_MAX_FILES_PER_REQUEST:5}
    max-files-per-reservation: ${RESERVATION_PHOTO_MAX_FILES_PER_RESERVATION:10}

app:
  frontend:
    base-url: ${APP_FRONTEND_BASE_URL}
  cors:
    allowed-origins:
      - ${APP_CORS_ALLOWED_ORIGIN_VITE}
      - ${APP_CORS_ALLOWED_ORIGIN_CRA}

admin:
  initial:
    username: ${ADMIN_INITIAL_USERNAME}
    password: ${ADMIN_INITIAL_PASSWORD}
    role: ${ADMIN_INITIAL_ROLE:ADMIN}
  security:
    unsafe-default-password: admin1234
    login:
      max-failure-count: ${ADMIN_LOGIN_MAX_FAILURE_COUNT:5}
      lock-minutes: ${ADMIN_LOGIN_LOCK_MINUTES:10}
